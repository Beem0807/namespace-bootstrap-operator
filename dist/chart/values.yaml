## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  ## One replica is the intended default. The operator is a single-writer
  ## controller and --leader-elect is set, so raising this gives you a warm
  ## standby rather than more throughput.
  ##
  ## There is deliberately no PodDisruptionBudget: a node drain pauses drift
  ## *correction*, not enforcement. Quotas, limit ranges, network policies and
  ## Pod Security labels are enforced by the API server and the CNI, and go on
  ## being enforced while the operator is down.
  ##
  replicas: 1

  image:
    repository: docker.io/nabeemdev/namespace-bootstrap-operator
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests.
  ##
  ## Memory scales with the size of the cluster, not with how many profiles you
  ## have. The operator watches Namespace and NetworkPolicy cluster-wide, so its
  ## cache holds every one of those objects. (ResourceQuota and LimitRange are
  ## narrowed to the operator's own two names, and managedFields are stripped from
  ## everything cached — see internal/controller/cache.go.)
  ##
  ## 256Mi is comfortable into the low thousands of namespaces. If the pod is
  ## OOM-killed, raise this first: the symptom is a CrashLoopBackOff that starts
  ## only once the cluster grows, and drift correction stops cluster-wide while it
  ## is down.
  ##
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## Optional prevention of edits to the resources this operator manages.
##
## NOTE: this block is hand-maintained. `kubebuilder edit --plugins helm/v2-alpha`
## regenerates values.yaml and drops it. The templates under
## templates/admission-policy/ survive regeneration and read the value defensively, so
## a values.yaml missing this block means the feature is simply disabled - never
## enabled by accident. `make helm-verify` fails if it has gone missing.
##
## The operator always *corrects* drift. Enabling this additionally *rejects* the write
## at admission, so an edit fails outright instead of being silently undone. See the
## README section "Two modes: correct after, or prevent before".
##
## Requires Kubernetes 1.30+ (ValidatingAdmissionPolicy went GA in 1.30).
##
admissionPolicy:
  enabled: false

  ## Restrict enforcement to particular namespaces. Empty means every namespace.
  ## Useful to pilot the policy on one tenant before enabling it everywhere, e.g.
  ##   namespaceSelector:
  ##     matchLabels:
  ##       platform.nabeem.com/profile: payments-profile
  ##
  namespaceSelector: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Webhook server configuration
##
webhook:
  enabled: false
  # Webhook server port
  port: 9443

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

