---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - limitranges
  - namespaces
  - resourcequotas
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - platform.nabeem.com
  resources:
  - namespaceprofiles
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - platform.nabeem.com
  resources:
  - namespaceprofiles/finalizers
  verbs:
  - update
- apiGroups:
  - platform.nabeem.com
  resources:
  - namespaceprofiles/status
  verbs:
  - get
  - patch
